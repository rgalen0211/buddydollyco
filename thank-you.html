<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thanks | Buddy Dolly</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link rel="preload" href="/assets/fonts/barlow-condensed-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/assets/site.css" />
  <style>
    .thanks { min-height: 100vh; display: grid; place-items: center; padding: 48px 16px; }
    .thanks-card { max-width: 620px; }
    .thanks img { width: 64px; height: auto; margin-bottom: 28px; }
    .thanks h1 { font-size: clamp(2.8rem, 7vw, 4.4rem); font-weight: 700; line-height: .95; margin-bottom: 18px; }
    .thanks p { font-size: 1.2rem; color: #2a3446; margin-bottom: 28px; }
  </style>
</head>
<body>
  <main class="thanks">
    <div class="thanks-card">
      <img src="/assets/buddy-logo.png" alt="Buddy Dolly logo" />
      <h1>Thanks — we got your message.</h1>
      <p>Your message was received. Ryan will follow up personally as soon as he can.</p>
      <div class="cta-row">
        <a class="btn btn-blue" href="https://buddydollyco.com">Back to Buddy Dolly</a>
        <a class="btn btn-outline" href="https://buddydollyco.com/distributors/">Distributor info</a>
      </div>
    </div>
  </main>
</body>
</html>
