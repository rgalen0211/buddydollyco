name: Update MindWise signature logo

on:
  push:
    paths:
      - '.github/workflows/update-mindwise-logo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild PNG from staged payload
        shell: bash
        run: |
          cat mindwise/logo.part1 mindwise/logo.part2 mindwise/logo.part3 | base64 -d > mindwise/mindwise-signature-logo.png
          file mindwise/mindwise-signature-logo.png
          rm -f mindwise/logo.part1 mindwise/logo.part2 mindwise/logo.part3 mindwise/mindwise-signature-logo.b64 mindwise/_binary_test.txt
      - name: Commit canonical logo
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mindwise/mindwise-signature-logo.png
          git add -u mindwise
          git commit -m 'Replace MindWise signature logo with canonical transparent PNG' || exit 0
          git push
